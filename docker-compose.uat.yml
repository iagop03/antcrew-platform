# UAT — standalone compose for the Hetzner ephemeral server.
# Not an override of docker-compose.yml; deployed alone on the remote host.
#
# PLATFORM_IMAGE must be set before running:
#   export PLATFORM_IMAGE=ghcr.io/<owner>/<repo>:uat-latest
#   docker compose -f docker-compose.uat.yml up -d
#
# DATABASE_URL (Neon) and SECRET_KEY come from .env.uat (written by the deploy workflow).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""

  platform:
    image: ${PLATFORM_IMAGE}
    env_file: .env.uat
    environment:
      APP_ENV: uat
      HOST: 0.0.0.0
      ANTCREW_SANDBOX: required
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      ANTCREW_REQUIRE_AUTH: "true"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "80:8000"
    restart: unless-stopped
    depends_on:
      - redis
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
