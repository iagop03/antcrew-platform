<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>antcrew — Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 380px;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand .wordmark {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
    }

    .auth-brand .wordmark span {
      color: var(--accent);
    }

    .auth-brand .tagline {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      gap: 0;
    }

    .auth-tab {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .15s, border-color .15s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: var(--font);
    }

    .auth-tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .auth-tab:hover:not(.active) {
      color: var(--text);
    }

    /* Forms */
    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .auth-form .form-group {
      margin-bottom: 14px;
    }

    .auth-form label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .auth-form input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      transition: border-color .15s;
      box-sizing: border-box;
    }

    .auth-form input:focus {
      border-color: var(--accent);
    }

    .auth-submit {
      width: 100%;
      padding: 9px 0;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      margin-top: 6px;
      font-family: var(--font);
    }

    .auth-submit:hover {
      background: var(--accent-hover);
    }

    .auth-submit:disabled {
      opacity: .6;
      cursor: default;
    }

    .auth-error {
      display: none;
      background: rgba(248, 81, 73, .12);
      border: 1px solid rgba(248, 81, 73, .3);
      border-radius: var(--radius);
      color: var(--red);
      font-size: 13px;
      padding: 9px 12px;
      margin-bottom: 14px;
    }

    .auth-error.visible {
      display: block;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <a class="wordmark" href="/">ant<span>crew</span></a>
      <div class="tagline">AI pipeline platform</div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login form -->
    <form class="auth-form active" id="form-login" onsubmit="handleLogin(event)">
      <div id="login-error" class="auth-error"></div>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="email" required placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="auth-submit" id="login-btn">Sign in</button>
    </form>

    <!-- Register form -->
    <form class="auth-form" id="form-register" onsubmit="handleRegister(event)">
      <div id="register-error" class="auth-error"></div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" autocomplete="email" required placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" autocomplete="new-password" required placeholder="Min. 8 characters">
      </div>
      <div class="form-group">
        <label for="reg-confirm">Confirm password</label>
        <input type="password" id="reg-confirm" autocomplete="new-password" required placeholder="Repeat password">
      </div>
      <button type="submit" class="auth-submit" id="register-btn">Create account</button>
    </form>

    <div class="auth-footer">
      <a href="/">Back to dashboard</a>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').classList.toggle('active', tab === 'login');
      document.getElementById('form-register').classList.toggle('active', tab === 'register');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('visible');
    }

    function clearError(id) {
      const el = document.getElementById(id);
      el.textContent = '';
      el.classList.remove('visible');
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearError('login-error');
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          credentials: 'same-origin',
        });
        if (r.ok) {
          window.location.href = '/';
          return;
        }
        let detail = 'Login failed';
        try { detail = (await r.json()).detail || detail; } catch {}
        showError('login-error', detail);
      } catch (err) {
        showError('login-error', 'Network error — please try again');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearError('register-error');

      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (password !== confirm) {
        showError('register-error', 'Passwords do not match');
        return;
      }
      if (password.length < 8) {
        showError('register-error', 'Password must be at least 8 characters');
        return;
      }

      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const r = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          credentials: 'same-origin',
        });
        if (r.ok) {
          window.location.href = '/';
          return;
        }
        let detail = 'Registration failed';
        try { detail = (await r.json()).detail || detail; } catch {}
        showError('register-error', detail);
      } catch (err) {
        showError('register-error', 'Network error — please try again');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    }
  </script>
</body>
</html>
