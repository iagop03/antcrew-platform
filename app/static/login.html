<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesiÃ³n â€” antcrew</title>
<link href="/static/tailwind.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<style>[x-cloak]{display:none}</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-6"
  x-data="loginApp()">

<div class="w-full max-w-md">

  <!-- Logo -->
  <div class="text-center mb-8">
    <span class="font-mono font-bold text-2xl text-indigo-400">antcrew</span>
    <p class="text-gray-500 text-sm mt-1">AI pipeline platform</p>
  </div>

  <!-- â”€â”€ STATE: login â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
  <div x-show="state === 'login'" x-cloak>
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
      <h2 class="text-lg font-semibold mb-6">Inicia sesiÃ³n</h2>

      <div class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">Email</label>
          <input x-model="email" type="email" placeholder="tu@empresa.com"
            @keydown.enter="doLogin()"
            class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">ContraseÃ±a</label>
          <input x-model="password" type="password" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢"
            @keydown.enter="doLogin()"
            class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600">
        </div>
      </div>

      <p x-show="loginError" x-cloak class="text-red-400 text-xs mt-3" x-text="loginError"></p>

      <button @click="doLogin()"
        :disabled="loginLoading || !email.trim() || !password"
        class="mt-6 w-full py-2.5 rounded-lg font-medium text-sm transition
          bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-50 disabled:cursor-not-allowed">
        <span x-show="!loginLoading">Iniciar sesiÃ³n â†’</span>
        <span x-show="loginLoading">Entrandoâ€¦</span>
      </button>
    </div>

    <p class="text-center text-xs text-gray-600 mt-5">
      Â¿No tienes cuenta?
      <a href="/onboard" class="text-indigo-400 hover:text-indigo-300 transition">Crear cuenta</a>
    </p>
  </div>

  <!-- â”€â”€ STATE: verify â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
  <div x-show="state === 'verify'" x-cloak>
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
      <h2 class="text-lg font-semibold mb-1">Verifica tu email</h2>
      <p class="text-gray-400 text-sm mb-6">
        Hemos enviado un cÃ³digo de 6 dÃ­gitos a <strong x-text="email"></strong>.
      </p>

      <div class="mb-4">
        <label class="block text-xs text-gray-400 mb-1.5">CÃ³digo de verificaciÃ³n</label>
        <input x-model="verifyCode" type="text" inputmode="numeric" maxlength="6"
          placeholder="123456"
          @keydown.enter="doVerify()"
          class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-3 text-2xl text-center font-mono tracking-[0.5em] focus:outline-none focus:border-indigo-500 placeholder-gray-700">
      </div>

      <p x-show="verifyError" x-cloak class="text-red-400 text-xs mb-3" x-text="verifyError"></p>

      <button @click="doVerify()"
        :disabled="verifyLoading || verifyCode.length !== 6"
        class="w-full py-2.5 rounded-lg font-medium text-sm transition
          bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-50 disabled:cursor-not-allowed">
        <span x-show="!verifyLoading">Verificar â†’</span>
        <span x-show="verifyLoading">Verificandoâ€¦</span>
      </button>

      <div class="mt-4 text-center">
        <button @click="resendCode()"
          :disabled="resendCooldown > 0"
          class="text-xs text-gray-500 hover:text-indigo-400 transition disabled:cursor-not-allowed">
          <span x-show="resendCooldown === 0">Â¿No recibiste el cÃ³digo? Reenviar</span>
          <span x-show="resendCooldown > 0">Reenviar en <span x-text="resendCooldown"></span>s</span>
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-gray-600 mt-5">
      <button @click="state = 'login'; verifyCode = ''; verifyError = ''"
        class="text-gray-500 hover:text-indigo-400 transition">
        â† Volver al login
      </button>
    </p>
  </div>

</div>

<script>
function loginApp() {
  return {
    state: 'login',

    email: '',
    password: '',
    loginLoading: false,
    loginError: '',

    verifyCode: '',
    verifyLoading: false,
    verifyError: '',
    resendCooldown: 0,

    async doLogin() {
      this.loginError = '';
      this.loginLoading = true;
      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.email.trim().toLowerCase(), password: this.password }),
          credentials: 'same-origin',
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          this.loginError = d.detail || `Error ${r.status}`;
          return;
        }
        const data = await r.json();
        if (data.email_verified === false) {
          // Account exists but email not verified â€” send a fresh code and show verify state
          await fetch('/auth/resend-code', { method: 'POST', credentials: 'same-origin' });
          this.state = 'verify';
          this._startResendCooldown(60);
          return;
        }
        window.location.href = '/dashboard';
      } catch (e) {
        this.loginError = 'Error de red â€” intÃ©ntalo de nuevo';
      } finally {
        this.loginLoading = false;
      }
    },

    async doVerify() {
      this.verifyError = '';
      this.verifyLoading = true;
      try {
        const r = await fetch('/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: this.verifyCode.trim() }),
          credentials: 'same-origin',
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          this.verifyError = d.detail || `Error ${r.status}`;
          return;
        }
        window.location.href = '/dashboard';
      } catch (e) {
        this.verifyError = 'Error de red â€” intÃ©ntalo de nuevo';
      } finally {
        this.verifyLoading = false;
      }
    },

    async resendCode() {
      if (this.resendCooldown > 0) return;
      try {
        await fetch('/auth/resend-code', { method: 'POST', credentials: 'same-origin' });
        this._startResendCooldown(60);
      } catch {}
    },

    _startResendCooldown(seconds) {
      this.resendCooldown = seconds;
      const t = setInterval(() => {
        this.resendCooldown--;
        if (this.resendCooldown <= 0) clearInterval(t);
      }, 1000);
    },
  };
}
</script>
</body>
</html>
