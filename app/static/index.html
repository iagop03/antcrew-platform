<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard â€” antcrew</title>
<link href="/static/tailwind.css" rel="stylesheet">
<script src="/static/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<link rel="stylesheet" href="/static/tabler-icons/tabler-icons.min.css">
<style>[x-cloak]{display:none}</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" x-data="dashFeed()" x-init="init()">

<!-- Nav -->
<style>.ac-nav{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;font-size:.8125rem;font-weight:500;color:rgb(107,114,128);text-decoration:none;transition:background .12s,color .12s;white-space:nowrap}.ac-nav:hover{background:rgba(31,41,55,.7);color:rgb(229,231,235)}.ac-nav.ac-on{background:rgba(31,41,55,.95);color:#fff}.ac-nav .ti{font-size:14px;flex-shrink:0}</style>
<nav class="sticky top-0 z-40 border-b border-gray-800" style="background:rgba(3,7,18,.96);backdrop-filter:blur(10px)">
  <div class="h-11 px-3 flex items-center gap-0.5">
    <a href="/dashboard" class="font-mono font-bold text-indigo-400 text-sm px-3 mr-1 shrink-0">antcrew</a>
    <div class="w-px h-4 bg-gray-800 mx-0.5 shrink-0"></div>
    <a href="/dashboard" class="ac-nav" data-ac="/dashboard"><i class="ti ti-layout-dashboard"></i><span data-i18n="nav.dashboard">Dashboard</span></a>
    <a href="/runs" class="ac-nav" data-ac="/runs"><i class="ti ti-player-play"></i><span data-i18n="nav.runs">Runs</span></a>
    <a href="/reviews" class="ac-nav" data-ac="/reviews"><i class="ti ti-eye-check"></i><span data-i18n="nav.reviews">Reviews</span><span id="nav-rev-badge" style="display:none" class="ml-1 inline-flex items-center justify-center w-4 h-4 rounded-full bg-amber-500 text-black text-xs font-bold"></span></a>
    <a href="/evals" class="ac-nav" data-ac="/evals"><i class="ti ti-chart-bar"></i><span data-i18n="nav.evals">Evals</span></a>
    <a href="/tickets" class="ac-nav" data-ac="/tickets"><i class="ti ti-checklist"></i><span data-i18n="nav.tickets">Tickets</span></a>
    <div class="w-px h-4 bg-gray-800 mx-1.5 shrink-0"></div>
    <a href="/compare" class="ac-nav" data-ac="/compare"><i class="ti ti-scale"></i><span data-i18n="nav.compare">Compare</span></a>
    <a href="/pipelines" class="ac-nav" data-ac="/pipelines"><i class="ti ti-sitemap"></i><span data-i18n="nav.pipelines">Pipelines</span></a>
    <div class="w-px h-4 bg-gray-800 mx-1.5 shrink-0"></div>
    <a href="/webhooks" class="ac-nav" data-ac="/webhooks"><i class="ti ti-webhook"></i><span data-i18n="nav.webhooks">Webhooks</span></a>
    <div class="w-px h-4 bg-gray-800 mx-1.5 shrink-0"></div>
    <a href="/settings" class="ac-nav" data-ac="/settings"><i class="ti ti-settings"></i><span data-i18n="nav.settings">Settings</span></a>
    <div class="ml-auto flex items-center gap-1.5">
      <span x-show="wsConnected" class="w-2 h-2 rounded-full bg-green-500 shrink-0" title="Live"></span>
      <span x-show="!wsConnected" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse shrink-0" title="Reconectandoâ€¦"></span>
      <div class="relative ml-1" id="ac-pf-w">
        <button id="ac-pf-b" style="width:28px;height:28px;border-radius:50%;background:#4338ca;color:#fff;font-size:11px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span id="ac-pf-i">?</span></button>
        <div id="ac-pf-d" style="display:none;position:absolute;right:0;top:calc(100% + 6px);width:192px;background:#111827;border:1px solid #1f2937;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.5);z-index:100;overflow:hidden">
          <div style="padding:10px 12px;border-bottom:1px solid #1f2937">
            <p id="ac-pf-n" style="font-size:.8125rem;font-weight:500;color:#f3f4f6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></p>
            <p id="ac-pf-e" style="font-size:.75rem;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px"></p>
          </div>
          <a href="/settings?tab=profile" data-i18n="nav.profile" style="display:block;padding:7px 12px;font-size:.8125rem;color:#9ca3af;text-decoration:none" onmouseover="this.style.background='rgba(31,41,55,.8)';this.style.color='#fff'" onmouseout="this.style.background='';this.style.color='#9ca3af'">My profile</a>
          <button data-i18n="nav.logout" onclick="fetch('/auth/token',{method:'DELETE',credentials:'same-origin'}).then(function(){localStorage.removeItem('antcrew_api_key');window.location.replace('/')})" style="display:block;width:100%;text-align:left;padding:7px 12px;font-size:.8125rem;color:#9ca3af;background:none;border:none;cursor:pointer;box-sizing:border-box" onmouseover="this.style.background='rgba(31,41,55,.8)';this.style.color='#fff'" onmouseout="this.style.background='';this.style.color='#9ca3af'">Log out</button>
          <div style="padding:5px 12px 6px;border-top:1px solid #1f2937;display:flex;align-items:center;gap:4px;margin-top:1px">
            <span data-i18n="nav.lang" style="font-size:.7rem;color:#4b5563;flex:1">Language</span>
            <button data-lang-btn="en" onclick="window.__i18n&&window.__i18n.setLang('en')" style="font-size:.75rem;background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:3px" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background=''">EN</button>
            <span style="font-size:.7rem;color:#374151">|</span>
            <button data-lang-btn="es" onclick="window.__i18n&&window.__i18n.setLang('es')" style="font-size:.75rem;background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:3px" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background=''">ES</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
<script>(function(){var p=location.pathname;document.querySelectorAll('.ac-nav[data-ac]').forEach(function(el){var dp=el.dataset.ac;if((dp==='/dashboard'&&(p==='/'||p==='/dashboard'))||(dp!=='/dashboard'&&(p===dp||p.startsWith(dp+'/'))))el.classList.add('ac-on');});document.addEventListener('click',function(e){var w=document.getElementById('ac-pf-w');if(w&&!w.contains(e.target)){var d=document.getElementById('ac-pf-d');if(d)d.style.display='none';}});var pb=document.getElementById('ac-pf-b');if(pb)pb.addEventListener('click',function(e){e.stopPropagation();var d=document.getElementById('ac-pf-d');if(d)d.style.display=d.style.display==='none'?'block':'none';});var k=localStorage.getItem('antcrew_api_key');var h={'Content-Type':'application/json'};if(k)h['X-Api-Key']=k;fetch('/reviews/?status=pending&limit=100',{headers:h,credentials:'same-origin'}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.length>0){var b=document.getElementById('nav-rev-badge');if(b){b.textContent=d.length>99?'99+':d.length;b.style.display='inline-flex';}}}).catch(function(){});fetch('/auth/me',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null}).then(function(me){if(!me)return;var n=document.getElementById('ac-pf-n');var em=document.getElementById('ac-pf-e');var i=document.getElementById('ac-pf-i');if(n)n.textContent=me.display_name||'';if(em)em.textContent=me.email||'';if(i){var s=(me.display_name||me.email||'').trim();var pts=s.split(/\s+/);i.textContent=(pts.length>1?pts[0][0]+pts[pts.length-1][0]:s.slice(0,2)).toUpperCase();}}).catch(function(){});})();</script>

<!-- Header -->
<div class="px-6 py-5 flex items-start justify-between">
  <div>
    <div class="flex items-center gap-2 mb-0.5">
      <h1 class="text-xl font-semibold">Dashboard</h1>
      <span x-show="workspace" class="text-gray-500 text-sm">/</span>
      <span x-show="workspace" class="text-gray-400 text-sm font-mono" x-text="workspace?.name"></span>
    </div>
    <p class="text-gray-500 text-xs">Actividad en tiempo real</p>
  </div>
  <div class="flex items-center gap-3">
    <!-- Budget pill -->
    <template x-if="budget && budget.budget_usd != null">
      <div class="flex items-center gap-2 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg text-xs">
        <span class="w-1.5 h-1.5 rounded-full"
          :class="budget.exhausted ? 'bg-red-500' : budget.remaining_usd / budget.budget_usd < 0.15 ? 'bg-yellow-500' : 'bg-green-500'"></span>
        <span class="font-mono"
          :class="budget.exhausted ? 'text-red-400' : 'text-gray-400'"
          x-text="'â‚¬' + budget.total_spend_usd.toFixed(2) + ' / â‚¬' + budget.budget_usd.toFixed(2) + ' este mes'"></span>
      </div>
    </template>
  </div>
</div>

<!-- Stat cards -->
<div class="px-6 grid grid-cols-4 gap-3 mb-6">
  <div class="bg-gray-900 border border-gray-800 rounded-xl px-4 py-3">
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1.5 flex items-center gap-1.5">
      <i class="ti ti-player-play text-blue-400"></i> Runs activos
    </p>
    <p class="text-2xl font-semibold font-mono text-blue-400" x-text="stats.running ?? 0"></p>
  </div>
  <div class="bg-gray-900 border border-gray-800 rounded-xl px-4 py-3">
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1.5 flex items-center gap-1.5">
      <i class="ti ti-eye text-amber-400"></i> Pend. revisiÃ³n
    </p>
    <p class="text-2xl font-semibold font-mono" :class="pendingCount > 0 ? 'text-amber-400' : 'text-gray-300'" x-text="pendingCount"></p>
  </div>
  <div class="bg-gray-900 border border-gray-800 rounded-xl px-4 py-3">
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1.5 flex items-center gap-1.5">
      <i class="ti ti-check text-green-400"></i> Completados hoy
    </p>
    <p class="text-2xl font-semibold font-mono text-green-400" x-text="runsToday"></p>
  </div>
  <div class="bg-gray-900 border border-gray-800 rounded-xl px-4 py-3">
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1.5 flex items-center gap-1.5">
      <i class="ti ti-currency-dollar text-purple-400"></i> Gasto total
    </p>
    <p class="text-2xl font-semibold font-mono text-purple-400"
      x-text="budget ? 'â‚¬' + budget.total_spend_usd.toFixed(2) : (stats.total_cost != null ? 'â‚¬' + Number(stats.total_cost).toFixed(2) : 'â€”')"></p>
  </div>
</div>

<!-- Activity feed -->
<div class="px-6 mb-8">
  <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
    <div class="px-4 py-2.5 border-b border-gray-800 flex items-center justify-between">
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-400">Actividad reciente</span>
      <button @click="loadFeed()" class="text-xs text-gray-500 hover:text-white transition flex items-center gap-1" data-i18n="common.refresh">
        <i class="ti ti-refresh text-xs"></i> Refresh
      </button>
    </div>

    <!-- Loading skeleton -->
    <template x-if="loading">
      <div class="divide-y divide-gray-800/50">
        <template x-for="i in [1,2,3,4,5]" :key="i">
          <div class="flex items-center gap-3 px-4 py-3">
            <div class="w-7 h-7 rounded-full bg-gray-800 animate-pulse flex-shrink-0"></div>
            <div class="flex-1 space-y-1.5">
              <div class="h-3 bg-gray-800 animate-pulse rounded w-2/3"></div>
              <div class="h-2.5 bg-gray-800 animate-pulse rounded w-1/3"></div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Empty state -->
    <template x-if="!loading && feed.length === 0">
      <div class="px-4 py-12 text-center">
        <i class="ti ti-inbox text-3xl text-gray-700 block mb-2"></i>
        <p class="text-gray-500 text-sm">Sin actividad reciente. Inicia un run para comenzar.</p>
      </div>
    </template>

    <!-- Feed items -->
    <div x-show="!loading && feed.length > 0" class="divide-y divide-gray-800/50">
      <template x-for="item in feed" :key="item.id">
        <div class="flex items-center gap-3 px-4 py-3 hover:bg-gray-800/40 transition cursor-pointer"
          @click="navigate(item)">
          <!-- Icon -->
          <div class="w-7 h-7 rounded-full bg-gray-800/80 flex items-center justify-center flex-shrink-0">
            <i :class="item.icon" class="text-sm"></i>
          </div>
          <!-- Content -->
          <div class="flex-1 min-w-0">
            <p class="text-sm text-gray-200 truncate" x-text="item.title"></p>
            <p class="text-xs text-gray-500 mt-0.5" x-text="item.subtitle"></p>
          </div>
          <!-- Badge -->
          <span x-show="item.badge"
            class="px-2 py-0.5 rounded-full text-xs font-medium flex-shrink-0"
            :class="item.badgeClass"
            x-text="item.badge"></span>
          <!-- Arrow -->
          <i class="ti ti-chevron-right text-gray-700 text-xs flex-shrink-0"></i>
        </div>
      </template>
    </div>
  </div>
</div>


<script>
function dashFeed() {
  return {
    workspace: null,
    budget: null,
    stats: {},
    pendingCount: 0,
    runsToday: 0,
    feed: [],
    loading: true,
    wsConnected: false,
    _wsBackoff: 1000,
    ws: null,
    apiHeaders(extra = {}) {
      const k = localStorage.getItem('antcrew_api_key');
      const h = { 'Content-Type': 'application/json', ...extra };
      if (k) h['X-Api-Key'] = k;
      return h;
    },

    async init() {
      // Auth guard: session-cookie users must be authenticated; API-key users pass through
      const apiKey = localStorage.getItem('antcrew_api_key');
      if (!apiKey) {
        try {
          const r = await fetch('/auth/me', { credentials: 'same-origin' });
          if (!r.ok) { window.location.replace('/'); return; }
          const me = await r.json();
          if (!me.workspace_id) { window.location.replace('/onboard'); return; }
        } catch { window.location.replace('/'); return; }
      }
      await Promise.all([this.loadWorkspace(), this.loadStats(), this.loadFeed()]);
      this.connectWs();
    },

    async loadWorkspace() {
      try {
        const r = await fetch('/workspaces/', { headers: this.apiHeaders() });
        if (!r.ok) return;
        const ws = await r.json();
        if (ws.length) {
          this.workspace = ws[0];
          const br = await fetch(`/workspaces/${ws[0].id}/spend`, { headers: this.apiHeaders() });
          if (br.ok) this.budget = await br.json();
        }
      } catch {}
    },

    async loadStats() {
      try {
        const r = await fetch('/runs/stats', { headers: this.apiHeaders() });
        if (r.ok) this.stats = await r.json();
      } catch {}
    },

    async loadFeed() {
      this.loading = true;
      try {
        const [runsR, reviewsR] = await Promise.all([
          fetch('/runs/?limit=30', { headers: this.apiHeaders() }),
          fetch('/reviews/?status=pending&limit=20', { headers: this.apiHeaders() }),
        ]);
        const items = [];
        if (runsR.ok) {
          const runs = await runsR.json();
          const today = new Date().toDateString();
          this.runsToday = runs.filter(r => r.status !== 'running' && new Date(r.created_at).toDateString() === today).length;
          runs.forEach(run => {
            const isRunning = run.status === 'running';
            const isSuccess = run.status === 'success';
            const isError = run.status === 'error';
            items.push({
              id: 'run-' + run.run_id,
              type: 'run',
              icon: isRunning ? 'ti ti-loader-2 text-blue-400 animate-spin'
                : isSuccess ? 'ti ti-circle-check text-green-400'
                : isError ? 'ti ti-circle-x text-red-400'
                : 'ti ti-minus text-gray-500',
              title: (run.request || run.team || '').slice(0, 72),
              subtitle: `${run.team} Â· ${run.cost_usd ? 'â‚¬' + run.cost_usd.toFixed(3) : 'â€”'} Â· ${this.timeAgo(run.created_at)}`,
              badge: run.status,
              badgeClass: isRunning ? 'bg-blue-900/50 text-blue-300'
                : isSuccess ? 'bg-green-900/50 text-green-300'
                : isError ? 'bg-red-900/50 text-red-300'
                : 'bg-gray-800 text-gray-400',
              ts: new Date(run.created_at),
              href: '/run/' + run.run_id,
            });
          });
        }
        if (reviewsR.ok) {
          const reviews = await reviewsR.json();
          this.pendingCount = reviews.length;
          reviews.forEach(rev => {
            items.push({
              id: 'rev-' + rev.review_id,
              type: 'review',
              icon: 'ti ti-eye text-amber-400',
              title: `RevisiÃ³n pendiente â€” ${rev.agent_name || 'agent'}`,
              subtitle: `Run ${(rev.run_id || '').slice(0, 8)} Â· ${this.timeAgo(rev.created_at)}`,
              badge: 'espera revisiÃ³n',
              badgeClass: 'bg-amber-900/50 text-amber-300',
              ts: new Date(rev.created_at),
              href: '/reviews',
            });
          });
        }
        items.sort((a, b) => b.ts - a.ts);
        this.feed = items;
      } catch {}
      this.loading = false;
    },

    navigate(item) { if (item.href) window.location.href = item.href; },

    connectWs() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const k = localStorage.getItem('antcrew_api_key') || '';
      this.ws = new WebSocket(`${proto}://${location.host}/ws/events`);
      this.ws.onopen = () => {
        this.wsConnected = true; this._wsBackoff = 1000;
        if (k) this.ws.send(JSON.stringify({ auth: k }));
      };
      this.ws.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (ev.type === 'ping') return;
        if (['pipeline.start', 'pipeline.end', 'hitl.review_required'].includes(ev.type)) {
          setTimeout(() => { this.loadFeed(); this.loadStats(); }, 400);
        }
      };
      this.ws.onclose = () => {
        this.wsConnected = false;
        setTimeout(() => this.connectWs(), this._wsBackoff);
        this._wsBackoff = Math.min(this._wsBackoff * 2, 30000);
      };
    },

    timeAgo(iso) {
      if (!iso) return 'â€”';
      const diff = (Date.now() - new Date(iso)) / 1000;
      if (diff < 60) return `${Math.floor(diff)}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    },
  };
}
</script>
</body>
</html>
