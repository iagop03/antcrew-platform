<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3730a3">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runs — antcrew</title>
<link rel="stylesheet" href="/static/tailwind.css">
<script src="/static/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}</script>
  <link rel="stylesheet" href="/static/tabler-icons/tabler-icons.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" x-data="dashboard()" x-init="init()">

<script src="/static/sidebar.js"></script>

<!-- Header -->
<div class="px-6 py-5 flex items-center justify-between">
  <div>
    <h1 class="text-xl font-semibold" data-i18n="runs.title">Pipeline Runs</h1>
    <p class="text-gray-400 text-sm mt-0.5" data-i18n="runs.subtitle">Live updates via WebSocket</p>
  </div>
  <button @click="showModal = true"
    class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition"
    data-i18n="runs.new">
    + New Run
  </button>
</div>

<!-- Stats -->
<div class="px-6 grid grid-cols-4 gap-3 mb-6">
  <template x-for="[label, key, color] in [['Total','total','indigo'],['Running','running','yellow'],['Success','success','green'],['Error','error','red']]">
    <div class="bg-gray-900 rounded-lg p-3 border border-gray-800">
      <div class="text-xs text-gray-400 mb-1" x-text="label"></div>
      <div class="text-2xl font-bold" :class="`text-${color}-400`">
        <template x-if="loadingStats">
          <span class="inline-block w-8 h-6 bg-gray-800 animate-pulse rounded"></span>
        </template>
        <template x-if="!loadingStats">
          <span x-text="stats[key] ?? 0"></span>
        </template>
      </div>
    </div>
  </template>
</div>

<!-- Error banner -->
<div x-show="loadError" class="px-6 mb-4">
  <div class="bg-red-950 border border-red-800 rounded-lg px-4 py-3 text-sm text-red-300 flex items-center gap-3">
    <span>⚠</span>
    <span x-text="loadError"></span>
    <button @click="loadRuns()" class="ml-auto text-xs text-red-400 hover:text-red-200 underline">Retry</button>
  </div>
</div>

<!-- Runs table -->
<div class="px-6">
  <!-- Filter chips -->
  <div class="flex items-center gap-2 mb-3">
    <span class="text-xs text-gray-500" data-i18n="runs.filter.label">Filtrar:</span>
    <template x-for="[label, val] in [['Todos', ''], ['Teams', 'teams'], ['Pipelines', 'pipelines'], ['Engine', 'engine']]" :key="val">
      <button @click="setFilter(val)"
        class="px-2.5 py-1 rounded-full text-xs font-medium border transition"
        :class="activeFilter === val
          ? 'bg-indigo-600 border-indigo-500 text-white'
          : 'bg-gray-900 border-gray-700 text-gray-400 hover:border-gray-500 hover:text-white'"
        x-text="label"></button>
    </template>
  </div>

  <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="border-b border-gray-800">
        <tr class="text-gray-400 text-xs uppercase tracking-wide">
          <th class="px-4 py-3 text-left" data-i18n="runs.col.run_id">Run ID</th>
          <th class="px-4 py-3 text-left" data-i18n="runs.col.team">Team</th>
          <th class="px-4 py-3 text-left" data-i18n="runs.col.request">Request</th>
          <th class="px-4 py-3 text-left" data-i18n="runs.col.status">Status</th>
          <th class="px-4 py-3 text-right" data-i18n="runs.col.cost">Cost</th>
          <th class="px-4 py-3 text-right" data-i18n="runs.col.duration">Duration</th>
          <th class="px-4 py-3 text-right" data-i18n="runs.col.started">Started</th>
        </tr>
      </thead>
      <tbody>
        <!-- Loading skeleton -->
        <template x-if="loadingRuns">
          <template x-for="i in [1,2,3]" :key="i">
            <tr class="border-t border-gray-800">
              <td colspan="7" class="px-4 py-3">
                <div class="h-4 bg-gray-800 animate-pulse rounded w-full"></div>
              </td>
            </tr>
          </template>
        </template>
        <!-- Empty state -->
        <template x-if="!loadingRuns && runs.length === 0 && !loadError">
          <tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">No runs yet. Click "+ New Run" to start one.</td></tr>
        </template>
        <!-- Rows -->
        <template x-for="run in runs" :key="run.run_id">
          <tr class="group border-t border-gray-800 hover:bg-gray-800/50 cursor-pointer transition"
              @click="window.location='/run/' + run.run_id">
            <td class="px-4 py-3 font-mono text-xs text-gray-400" x-text="run.run_id.slice(0,12) + '…'"></td>
            <td class="px-4 py-3 font-medium">
              <template x-if="run.team?.startsWith('pipeline:')">
                <span class="inline-flex items-center gap-1">
                  <span class="text-xs bg-indigo-950 border border-indigo-800 text-indigo-300 px-1.5 py-0.5 rounded font-mono">pipeline</span>
                </span>
              </template>
              <template x-if="!run.team?.startsWith('pipeline:')">
                <span class="text-indigo-300" x-text="run.team"></span>
              </template>
            </td>
            <td class="px-4 py-3 text-gray-300 max-w-xs truncate" x-text="run.request"></td>
            <td class="px-4 py-3">
              <div class="flex items-center gap-1.5">
                <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                  :class="{
                    'bg-yellow-900/50 text-yellow-300': run.status === 'running',
                    'bg-green-900/50 text-green-300': run.status === 'success',
                    'bg-red-900/50 text-red-300': run.status === 'error',
                    'bg-gray-800 text-gray-400': !['running','success','error'].includes(run.status)
                  }"
                  x-text="run.status"></span>
                <!-- Deep-link to review queue when a pending HITL review exists for this run -->
                <template x-if="pendingReviewRunIds[run.run_id]">
                  <a href="/reviews/" @click.stop
                    title="This run has a pending HITL review"
                    class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded bg-amber-900/50 text-amber-300 hover:bg-amber-800/70 transition">
                    <span class="w-1 h-1 rounded-full bg-amber-400 animate-pulse"></span>
                    Review
                  </a>
                </template>
              </div>
            </td>
            <td class="px-4 py-3 text-right text-gray-300 font-mono text-xs"
                x-text="run.cost_usd ? '€' + run.cost_usd.toFixed(4) : '—'"></td>
            <td class="px-4 py-3 text-right text-gray-400 text-xs"
                x-text="run.duration_s ? run.duration_s.toFixed(0) + 's' : '—'"></td>
            <td class="px-4 py-3 text-right text-gray-400 text-xs">
              <div class="flex items-center justify-end gap-2">
                <span x-text="timeAgo(run.created_at)"></span>
                <!-- Re-run: pre-fills the modal with same team + request, no navigation -->
                <template x-if="run.team && !run.team.startsWith('pipeline:') && run.team !== 'engine'">
                  <button @click.stop="reRun(run)"
                    title="Re-run with same team and request"
                    class="opacity-0 group-hover:opacity-100 transition-opacity text-xs px-1.5 py-0.5 rounded border border-gray-700 text-gray-500 hover:border-indigo-500 hover:text-indigo-300">
                    ⟳
                  </button>
                </template>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex items-center justify-between mt-3 px-1" x-show="runsOffset > 0 || hasMore">
    <button @click="prevPage()" :disabled="runsOffset === 0"
      class="flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-lg border transition"
      :class="runsOffset === 0 ? 'border-gray-800 text-gray-600 cursor-not-allowed' : 'border-gray-700 text-gray-300 hover:border-gray-500 hover:text-white'">
      ← Anterior
    </button>
    <span class="text-xs text-gray-500" x-text="`Mostrando ${runsOffset + 1}–${runsOffset + runs.length}`"></span>
    <button @click="nextPage()" :disabled="!hasMore"
      class="flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-lg border transition"
      :class="!hasMore ? 'border-gray-800 text-gray-600 cursor-not-allowed' : 'border-gray-700 text-gray-300 hover:border-gray-500 hover:text-white'">
      Siguiente →
    </button>
  </div>
</div>

<!-- New Run Modal -->
<div x-show="showModal" x-cloak class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full max-w-md shadow-2xl max-h-[85vh] overflow-y-auto" @click.stop>
    <h2 class="text-lg font-semibold mb-4" data-i18n="runs.modal.title">Nueva Ejecución</h2>

    <!-- Mode tabs -->
    <div class="flex gap-1 mb-5 bg-gray-800 rounded-lg p-1">
      <button type="button" @click="form.mode = 'team'"
        class="flex-1 text-sm py-1.5 rounded-md transition font-medium"
        :class="form.mode === 'team' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'"
        data-i18n="runs.modal.team_run">
        Ejecución de equipo
      </button>
      <button type="button" @click="form.mode = 'engine'"
        class="flex-1 text-sm py-1.5 rounded-md transition font-medium"
        :class="form.mode === 'engine' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'"
        data-i18n="runs.modal.engine_run">
        Ejecución de motor
      </button>
    </div>

    <form @submit.prevent="triggerRun()">

      <!-- ── TEAM MODE ── -->
      <template x-if="form.mode === 'team'">
        <div>
          <template x-if="templates.length > 0">
            <div class="mb-4">
              <label class="block text-sm text-gray-400 mb-1" data-i18n="runs.modal.load_template">Cargar desde plantilla</label>
              <div class="flex flex-wrap gap-1.5">
                <template x-for="t in templates" :key="t.id">
                  <button type="button" @click="loadTemplate(t)"
                    class="text-xs px-2.5 py-1 rounded-lg border border-gray-700 text-gray-300 hover:border-indigo-500 hover:text-indigo-300 transition"
                    x-text="t.name"></button>
                </template>
              </div>
            </div>
          </template>
          <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1" data-i18n="form.team">Equipo</label>
            <select x-model="form.team"
              @change="agentConfigOpen = false; agentInfo = []; agentInfoTeam = ''; agentModels = {}; loadWorkspacePresets()"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
              <template x-for="t in teamOptions" :key="t">
                <option :value="t" x-text="t"></option>
              </template>
            </select>
          </div>

          <!-- Preset chips -->
          <div class="mb-3" x-show="workspacePresets.filter(p => p.team === form.team).length > 0">
            <div class="flex flex-wrap gap-1.5 items-center">
              <span class="text-xs text-gray-500">Presets:</span>
              <template x-for="p in workspacePresets.filter(p => p.team === form.team)" :key="p.id">
                <div class="flex items-center">
                  <button type="button" @click="applyPreset(p)"
                    class="text-xs px-2.5 py-1 rounded-l border border-gray-700 text-indigo-300 hover:border-indigo-500 hover:bg-indigo-950 transition"
                    x-text="p.name"></button>
                  <button type="button" @click="deletePreset(p.id)"
                    class="text-xs px-1.5 py-1 rounded-r border border-l-0 border-gray-700 text-gray-500 hover:border-red-600 hover:text-red-400 transition">×</button>
                </div>
              </template>
            </div>
          </div>

          <!-- Agent config toggle -->
          <div class="mb-4">
            <button type="button" @click="toggleAgentConfig()"
              class="flex items-center gap-1.5 text-xs text-gray-400 hover:text-white transition select-none">
              <span x-text="agentConfigOpen ? '▾' : '▸'"></span>
              Configurar modelos por agente
              <span x-show="Object.keys(agentModels).some(k => agentModels[k])"
                class="text-indigo-400">
                (<span x-text="Object.values(agentModels).filter(v=>v).length"></span> override<span x-show="Object.values(agentModels).filter(v=>v).length !== 1">s</span>)
              </span>
            </button>

            <div x-show="agentConfigOpen" x-transition class="mt-2.5 bg-gray-800 rounded-lg p-3 border border-gray-700">
              <div x-show="agentInfoLoading" class="text-xs text-gray-500 py-1">Cargando agentes…</div>
              <template x-if="!agentInfoLoading && agentInfo.length > 0">
                <div>
                  <!-- Flow visual -->
                  <div class="flex flex-wrap items-center gap-1 mb-3 text-xs">
                    <template x-for="(ag, idx) in agentInfo" :key="ag.name">
                      <span class="flex items-center gap-1">
                        <span class="bg-gray-700 border border-gray-600 rounded px-2 py-0.5 text-gray-300"
                          x-text="ag.name.replace('Agent','')"></span>
                        <span x-show="idx < agentInfo.length - 1" class="text-gray-600">→</span>
                      </span>
                    </template>
                  </div>
                  <!-- Per-agent selectors -->
                  <div class="space-y-2">
                    <template x-for="ag in agentInfo" :key="ag.name">
                      <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-400 w-28 shrink-0 truncate"
                          :title="ag.name"
                          x-text="ag.name.replace('Agent','')"></span>
                        <select x-model="agentModels[ag.name]"
                          class="flex-1 bg-gray-900 border border-gray-600 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500">
                          <option value=""
                            x-text="workspaceAgentModels[ag.name] ? `— ${workspaceAgentModels[ag.name]} (ws) —` : (workspaceAgentModels.default ? `— ${workspaceAgentModels.default} (ws default) —` : '— platform default —')"></option>
                          <option value="claude:claude-sonnet-5">Claude Sonnet 5</option>
                          <option value="claude:claude-opus-5">Claude Opus 5</option>
                          <option value="claude:claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
                          <option value="gpt-4o">GPT-4o</option>
                          <option value="deepseek:deepseek-chat">DeepSeek Chat</option>
                          <option value="groq:llama-3.3-70b-versatile">Groq Llama 3.3 70B</option>
                          <option value="gemini:gemini-2.0-flash">Gemini 2.0 Flash</option>
                          <option value="simulated">Simulated</option>
                        </select>
                      </div>
                    </template>
                  </div>
                  <!-- Save preset footer -->
                  <div class="mt-3 pt-3 border-t border-gray-700 flex items-center gap-2">
                    <input type="text" x-model="presetSaveName" placeholder="Nombre del preset"
                      class="flex-1 bg-gray-900 border border-gray-600 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500">
                    <button type="button" @click="savePreset()" :disabled="!presetSaveName.trim()"
                      class="text-xs px-3 py-1 rounded border border-gray-600 text-gray-400 hover:border-indigo-500 hover:text-indigo-300 transition disabled:opacity-40">
                      Guardar preset
                    </button>
                  </div>
                  <p x-show="presetSaveMsg" class="text-xs text-green-400 mt-1.5" x-text="presetSaveMsg"></p>
                </div>
              </template>
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1" data-i18n="form.request">Solicitud</label>
            <textarea x-model="form.request" rows="3"
              placeholder="Construye un módulo de autenticación con JWT y refresh tokens…"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
          </div>
          <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1" data-i18n="runs.modal.max_cost">Coste máximo (€, opcional)</label>
            <input type="number" step="0.01" min="0.01" x-model.number="form.max_cost_usd"
              placeholder="ej. 2.00"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div class="mb-4 flex items-center gap-2.5">
            <input type="checkbox" id="hitl-toggle" x-model="form.hitl"
              class="w-4 h-4 rounded border-gray-600 bg-gray-800 text-amber-500 focus:ring-amber-500 focus:ring-offset-0">
            <label for="hitl-toggle" class="text-sm text-gray-300 select-none cursor-pointer" data-i18n="runs.modal.hitl">
              Activar HITL — pausar para revisión humana en cada punto de control
            </label>
          </div>
          <div class="mb-5">
            <label class="block text-sm text-gray-400 mb-1" data-i18n="runs.modal.repo_url">URL del repositorio (opcional)</label>
            <input type="url" x-model="form.repo_url"
              placeholder="https://github.com/org/repo"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            <p class="text-xs text-gray-500 mt-1">Clone this repo and inject its contents as context.</p>
          </div>
          <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1">Modelo (opcional)</label>
            <select x-model="form.model"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
              <option value="" x-text="workspaceDefault ? `— ${workspaceDefaultLabel} (workspace default) —` : '— platform default (claude) —'"></option>
              <option value="claude:claude-sonnet-5">Claude Sonnet 5</option>
              <option value="claude:claude-opus-5">Claude Opus 5</option>
              <option value="claude:claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
              <option value="gpt-4o">OpenAI GPT-4o</option>
              <option value="o3-mini">OpenAI o3-mini</option>
              <option value="deepseek:deepseek-chat">DeepSeek Chat</option>
              <option value="deepseek:deepseek-reasoner">DeepSeek Reasoner</option>
              <option value="groq:llama-3.3-70b-versatile">Groq Llama 3.3 70B</option>
              <option value="groq:mixtral-8x7b-32768">Groq Mixtral 8x7B</option>
              <option value="gemini:gemini-2.0-flash">Gemini 2.0 Flash</option>
              <option value="mistral:mistral-large-latest">Mistral Large</option>
              <option value="xai:grok-2">xAI Grok-2</option>
              <option value="simulated">Simulated (testing)</option>
            </select>
            <p class="text-xs text-gray-500 mt-1">Sobreescribe el default del workspace solo para este run.</p>
          </div>
          <div class="mt-3 flex items-center gap-2">
            <input type="text" x-model="form.templateName" placeholder="Nombre de plantilla (opcional)"
              class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
            <button type="button" @click="saveTemplate()" :disabled="!form.templateName.trim()"
              class="text-xs px-3 py-1.5 rounded-lg border border-gray-700 text-gray-400 hover:border-indigo-500 hover:text-indigo-300 transition disabled:opacity-40"
              data-i18n="runs.modal.save_template">
              Guardar plantilla
            </button>
          </div>
        </div>
      </template>

      <!-- ── ENGINE MODE ── -->
      <template x-if="form.mode === 'engine'">
        <div>
          <div class="mb-1 flex items-center gap-2">
            <input type="checkbox" id="resume-toggle" x-model="form.resume"
              class="w-4 h-4 rounded border-gray-600 bg-gray-800 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-0">
            <label for="resume-toggle" class="text-sm text-gray-300 select-none cursor-pointer" data-i18n="runs.modal.resume_toggle">
              Reanudar — continuar una ejecución anterior desde el directorio de salida
            </label>
          </div>
          <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1">
              Goal <template x-if="form.resume"><span class="text-gray-500">(optional when resuming)</span></template>
            </label>
            <textarea x-model="form.goal" rows="3"
              :placeholder="form.resume ? 'Leave blank to reuse saved goal…' : 'Build a REST API for a task manager with auth…'"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
          </div>
          <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-1" data-i18n="runs.modal.tech">Stack tecnológico (separado por comas, opcional)</label>
            <input type="text" x-model="form.tech"
              placeholder="Python, FastAPI, SQLite"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div class="mb-4 flex items-center gap-2.5">
            <input type="checkbox" id="full-toggle" x-model="form.full"
              class="w-4 h-4 rounded border-gray-600 bg-gray-800 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-0">
            <label for="full-toggle" class="text-sm text-gray-300 select-none cursor-pointer" data-i18n="runs.modal.full_pipeline">
              Pipeline completo — código + tests + revisión (desmarcar para solo planificación)
            </label>
          </div>
          <div class="mb-5">
            <label class="block text-sm text-gray-400 mb-1">
              Output dir <template x-if="form.resume"><span class="text-red-400">*</span></template>
              <span class="text-gray-500">(server path, optional)</span>
            </label>
            <input type="text" x-model="form.outputDir"
              placeholder="/srv/antcrew/my-project"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            <p class="text-xs text-gray-500 mt-1">Absolute path on the server where artifacts are persisted.</p>
          </div>
          <div class="mb-5">
            <label class="block text-sm text-gray-400 mb-1">
              Source dir <span class="text-gray-500">(--from-dir, optional)</span>
            </label>
            <input type="text" x-model="form.sourceDir"
              placeholder="/srv/repos/my-project"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            <p class="text-xs text-gray-500 mt-1">Load existing codebase into the store — skips planning phases.</p>
          </div>
        </div>
      </template>

      <div class="flex gap-3 mt-1">
        <button type="button" @click="showModal = false"
          class="flex-1 bg-gray-800 hover:bg-gray-700 text-sm py-2 rounded-lg transition"
          data-i18n="common.cancel">Cancelar</button>
        <button type="submit" :disabled="submitting"
          class="flex-1 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-sm py-2 rounded-lg font-medium transition"
          x-text="submitting ? 'Iniciando…' : (form.mode === 'engine' && form.resume ? 'Reanudar' : 'Iniciar')"></button>
      </div>
      <p x-show="formError" class="text-red-400 text-xs mt-3" x-text="formError"></p>
    </form>
  </div>
</div>

<script>
function dashboard() {
  return {
    runs: [],
    stats: { total: 0, running: 0, success: 0, error: 0 },
    loadingRuns: true,
    loadingStats: true,
    loadError: '',
    showModal: false,
    submitting: false,
    formError: '',
    availableTeams: [],
    teamOptions: [],
    templates: [],
    pendingReviews: 0,
    pendingReviewRunIds: {},
    runningEvals: 0,
    form: {
      mode: 'team',
      team: 'DevTeam', request: '', max_cost_usd: null, hitl: false, repo_url: '', templateName: '', model: '',
      goal: '', tech: '', full: true, outputDir: '', sourceDir: '', resume: false,
    },
    workspaceDefault: '',
    workspaceDefaultLabel: '',
    workspaceId: null,
    workspaceAgentModels: {},
    agentConfigOpen: false,
    agentInfoLoading: false,
    agentInfo: [],
    agentInfoTeam: '',
    agentModels: {},
    workspacePresets: [],
    presetSaveName: '',
    presetSaveMsg: '',
    activeFilter: '',
    runsOffset: 0,
    runsLimit: 50,
    hasMore: false,
    ws: null,
    wsConnected: false,
    _wsBackoff: 1000,

    apiHeaders(extra = {}) {
      const k = localStorage.getItem('antcrew_api_key');
      const h = { 'Content-Type': 'application/json', ...extra };
      if (k) h['X-Api-Key'] = k;
      return h;
    },

    async init() {
      await Promise.all([this.loadTeams(), this.loadRuns(), this.loadStats(), this.loadTemplates(), this.loadPendingReviews(), this.loadWorkspaceDefault()]);
      this.connectWs();
    },

    async loadWorkspaceDefault() {
      try {
        const r = await fetch('/workspaces/', { headers: this.apiHeaders() });
        if (!r.ok) return;
        const ws = (await r.json())[0];
        if (!ws) return;
        this.workspaceId = ws.id;
        this.workspaceAgentModels = ws.agent_models || {};
        const def = ws?.agent_models?.default;
        if (def) {
          this.workspaceDefault = def;
          const LABELS = {
            'claude:claude-sonnet-5': 'Claude Sonnet 5', 'claude:claude-opus-5': 'Claude Opus 5',
            'claude:claude-sonnet-4-5': 'Claude Sonnet 4.5', 'claude:claude-haiku-4-5': 'Claude Haiku 4.5',
            'gpt-4o': 'GPT-4o', 'gpt-4o-mini': 'GPT-4o mini', 'o3': 'o3',
            'deepseek:deepseek-chat': 'DeepSeek Chat', 'groq:llama-3.3-70b': 'Llama 3.3 70B (Groq)',
            'gemini:gemini-2.0-flash': 'Gemini 2.0 Flash', 'simulated': 'Simulated (testing)',
          };
          this.workspaceDefaultLabel = LABELS[def] || def;
        }
        this.loadWorkspacePresets();
      } catch {}
    },

    async loadWorkspacePresets() {
      if (!this.workspaceId) return;
      try {
        const r = await fetch(`/workspaces/${this.workspaceId}/presets`, { headers: this.apiHeaders() });
        if (r.ok) this.workspacePresets = await r.json();
      } catch {}
    },

    toggleAgentConfig() {
      this.agentConfigOpen = !this.agentConfigOpen;
      if (this.agentConfigOpen && this.agentInfoTeam !== this.form.team) {
        this.loadAgentInfo();
      }
    },

    async loadAgentInfo() {
      this.agentInfoLoading = true;
      try {
        const r = await fetch(`/run/teams/${this.form.team}/agents`, { headers: this.apiHeaders() });
        if (r.ok) {
          const d = await r.json();
          this.agentInfo = d.agents;
          this.agentInfoTeam = this.form.team;
          for (const ag of this.agentInfo) {
            if (this.agentModels[ag.name] === undefined) this.agentModels[ag.name] = '';
          }
        }
      } catch {} finally {
        this.agentInfoLoading = false;
      }
    },

    applyPreset(p) {
      this.agentModels = {};
      for (const [k, v] of Object.entries(p.model_overrides || {})) {
        this.agentModels[k] = v;
      }
      if (this.agentInfoTeam === this.form.team) {
        for (const ag of this.agentInfo) {
          if (this.agentModels[ag.name] === undefined) this.agentModels[ag.name] = '';
        }
      }
      if (!this.agentConfigOpen) this.toggleAgentConfig();
    },

    async savePreset() {
      const name = this.presetSaveName.trim();
      if (!name || !this.workspaceId) return;
      const overrides = Object.fromEntries(Object.entries(this.agentModels).filter(([, v]) => v));
      try {
        const r = await fetch(`/workspaces/${this.workspaceId}/presets`, {
          method: 'POST',
          headers: this.apiHeaders(),
          body: JSON.stringify({ name, team: this.form.team, model_overrides: Object.keys(overrides).length ? overrides : null }),
        });
        if (r.ok) {
          this.workspacePresets.push(await r.json());
          this.presetSaveName = '';
          this.presetSaveMsg = 'Preset guardado ✓';
          setTimeout(() => { this.presetSaveMsg = ''; }, 3000);
        }
      } catch {}
    },

    async deletePreset(id) {
      if (!this.workspaceId) return;
      try {
        const r = await fetch(`/workspaces/${this.workspaceId}/presets/${id}`, {
          method: 'DELETE',
          headers: this.apiHeaders(),
        });
        if (r.status === 204) this.workspacePresets = this.workspacePresets.filter(p => p.id !== id);
      } catch {}
    },

    async loadPendingReviews() {
      try {
        const r = await fetch('/reviews/?status=pending&limit=100', { headers: this.apiHeaders() });
        if (r.ok) {
          const reviews = await r.json();
          this.pendingReviews = reviews.length;
          const ids = {};
          reviews.forEach(rv => { if (rv.run_id) ids[rv.run_id] = true; });
          this.pendingReviewRunIds = ids;
        }
      } catch {}
    },

    async loadTemplates() {
      try {
        const r = await fetch('/templates/', { headers: this.apiHeaders() });
        if (r.ok) this.templates = await r.json();
      } catch {}
    },

    loadTemplate(t) {
      this.form.team = t.team;
      this.form.request = t.request;
      this.form.max_cost_usd = t.max_cost_usd || null;
      this.form.hitl = t.hitl || false;
      this.form.repo_url = t.repo_url || '';
    },

    async loadTeams() {
      try {
        const r = await fetch('/run/teams', { headers: this.apiHeaders() });
        if (!r.ok) return;
        const d = await r.json();
        this.availableTeams = d.teams;
        // teamOptions excludes special types handled by their own modes
        this.teamOptions = d.teams.filter(t => t !== 'engine' && t !== 'custom');
        this.form.team = this.teamOptions[0] || 'DevTeam';
      } catch {}
    },

    setFilter(val) {
      this.activeFilter = val;
      this.runsOffset = 0;
      this.loadRuns();
    },

    async loadRuns() {
      this.loadingRuns = true;
      this.loadError = '';
      try {
        let limit = this.runsLimit;
        let qs = `/runs/?limit=${limit}&offset=${this.runsOffset}`;
        if (this.activeFilter === 'pipelines') qs += '&team_prefix=pipeline%3A';
        else if (this.activeFilter === 'engine') qs += '&team=engine';
        // 'teams': no server-side team filter; exclude pipelines and engine client-side
        const r = await fetch(qs, { headers: this.apiHeaders() });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const rawData = await r.json();
        let data = rawData;
        if (this.activeFilter === 'teams') {
          data = rawData.filter(r => r.team !== 'engine' && !r.team?.startsWith('pipeline:'));
        }
        this.runs = data;
        this.hasMore = rawData.length >= limit;
      } catch (err) {
        this.loadError = `Failed to load runs: ${err.message}`;
      } finally {
        this.loadingRuns = false;
      }
    },

    prevPage() {
      if (this.runsOffset === 0) return;
      this.runsOffset = Math.max(0, this.runsOffset - this.runsLimit);
      this.loadRuns();
    },

    nextPage() {
      if (!this.hasMore) return;
      this.runsOffset += this.runsLimit;
      this.loadRuns();
    },

    async loadStats() {
      this.loadingStats = true;
      try {
        const r = await fetch('/runs/stats', { headers: this.apiHeaders() });
        if (r.ok) this.stats = await r.json();
      } catch {} finally {
        this.loadingStats = false;
      }
    },

    connectWs() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const k = localStorage.getItem('antcrew_api_key') || '';
      const ws = new WebSocket(`${proto}://${location.host}/ws/events`);
      this.ws = ws;
      ws.onopen = () => {
        if (this.ws !== ws) return;
        this.wsConnected = true; this._wsBackoff = 1000;
        if (k) ws.send(JSON.stringify({ auth: k }));
      };
      ws.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (ev.type === 'ping') return;
        if (ev.type === 'hitl.review_required') {
          this.pendingReviews++;
        } else if (ev.type === 'eval.done') {
          this.runningEvals = Math.max(0, this.runningEvals - 1);
        } else if (ev.type === 'eval.start') {
          this.runningEvals++;
        } else if (ev.type === 'pipeline.start') {
          this.loadRuns(); this.loadStats();
        } else if (ev.type === 'pipeline.end' && ev.run_id) {
          const run = this.runs.find(r => r.run_id === ev.run_id);
          if (run) {
            run.status = ev.payload.success ? 'success' : 'error';
            run.cost_usd = ev.payload.cost_usd || 0;
          }
          this.loadStats();
        }
      };
      ws.onclose = () => {
        if (this.ws !== ws) return;
        this.wsConnected = false;
        setTimeout(() => this.connectWs(), this._wsBackoff);
        this._wsBackoff = Math.min(this._wsBackoff * 2, 30000);
      };
    },

    async saveTemplate() {
      const name = this.form.templateName.trim();
      if (!name) return;
      try {
        const body = { name, team: this.form.team, request: this.form.request, hitl: this.form.hitl };
        if (this.form.max_cost_usd) body.max_cost_usd = this.form.max_cost_usd;
        if (this.form.repo_url.trim()) body.repo_url = this.form.repo_url.trim();
        const r = await fetch('/templates/', {
          method: 'POST',
          headers: this.apiHeaders(),
          body: JSON.stringify(body),
        });
        if (r.ok) {
          const t = await r.json();
          this.templates.push(t);
          this.form.templateName = '';
        }
      } catch {}
    },

    async triggerRun() {
      this.submitting = true;
      this.formError = '';
      try {
        let url, body;

        if (this.form.mode === 'engine') {
          url = '/engine/run';
          body = { goal: this.form.goal.trim(), full: this.form.full, resume: this.form.resume };
          if (this.form.tech.trim()) body.tech = this.form.tech.split(',').map(s => s.trim()).filter(Boolean);
          if (this.form.outputDir.trim()) body.output_dir = this.form.outputDir.trim();
          if (this.form.sourceDir.trim()) body.source_dir = this.form.sourceDir.trim();
        } else {
          url = '/run/';
          body = { team: this.form.team, request: this.form.request };
          if (this.form.max_cost_usd) body.max_cost_usd = this.form.max_cost_usd;
          if (this.form.hitl) body.hitl = true;
          if (this.form.repo_url.trim()) body.repo_url = this.form.repo_url.trim();
          if (this.form.model) body.model = this.form.model;
          const overrides = Object.fromEntries(Object.entries(this.agentModels).filter(([, v]) => v));
          if (Object.keys(overrides).length) body.model_overrides = overrides;
        }

        const r = await fetch(url, {
          method: 'POST',
          headers: this.apiHeaders(),
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const d = await r.json();
          this.formError = d.detail || 'Error starting run';
          return;
        }
        const d = await r.json();
        this.showModal = false;
        // Reset only the relevant fields
        if (this.form.mode === 'engine') {
          this.form.goal = '';
          this.form.tech = '';
          this.form.outputDir = '';
          this.form.sourceDir = '';
          this.form.resume = false;
        } else {
          this.form.request = '';
          this.form.max_cost_usd = null;
          this.form.hitl = false;
          this.form.repo_url = '';
          this.form.templateName = '';
          this.form.model = '';
          this.agentModels = {};
          this.agentConfigOpen = false;
          this.presetSaveName = '';
          this.presetSaveMsg = '';
        }
        if (d.run_id) window.location = '/run/' + d.run_id;
        else await this.loadRuns();
      } catch (err) {
        this.formError = err.message;
      } finally {
        this.submitting = false;
      }
    },

    reRun(run) {
      this.form.mode = 'team';
      this.form.team = run.team;
      this.form.request = run.request;
      this.form.max_cost_usd = null;
      this.form.hitl = false;
      this.form.repo_url = '';
      this.form.model = '';
      this.agentModels = {};
      this.agentConfigOpen = false;
      this.showModal = true;
    },

    timeAgo(iso) {
      if (!iso) return '—';
      const diff = (Date.now() - new Date(iso)) / 1000;
      if (diff < 60) return `${Math.floor(diff)}s ago`;
      if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
      return `${Math.floor(diff/3600)}h ago`;
    },
  }
}
</script>
</body>
</html>
