<!-- Header -->
<div class="px-6 py-5 flex items-center justify-between">
  <div>
    <h1 class="text-xl font-semibold" data-i18n="whk.title">Webhook Management</h1>
    <p class="text-gray-400 text-sm mt-0.5" data-i18n="whk.subtitle">Register and manage per-workspace webhook URLs</p>
  </div>
</div>

<!-- Error banner -->
<div x-show="error" class="px-6 mb-4">
  <div class="bg-red-950 border border-red-800 rounded-lg px-4 py-3 text-sm text-red-300 flex items-center gap-3">
    <span>⚠</span>
    <span x-text="error"></span>
    <button @click="error = null" class="ml-auto text-xs text-red-400 hover:text-red-200">✕</button>
  </div>
</div>

<!-- Workspace selector -->
<div class="px-6 mb-6 flex items-center gap-3">
  <label class="text-sm text-gray-400" data-i18n="whk.workspace">Workspace:</label>
  <select x-model="selectedWsId" @change="loadHooks()"
    class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
    <option value="">— select —</option>
    <template x-for="ws in workspaces" :key="ws.id">
      <option :value="ws.id" x-text="`${ws.name} (${ws.slug})`"></option>
    </template>
  </select>
  <span x-show="loading" class="text-xs text-gray-500 animate-pulse">loading…</span>
</div>

<!-- Webhooks table -->
<div class="px-6" x-show="selectedWsId">
  <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden mb-6">
    <div class="px-4 py-3 border-b border-gray-800 flex items-center justify-between">
      <span class="text-sm font-medium" data-i18n="whk.registered">Registered webhooks</span>
      <button @click="showCreate = true"
        class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition">
        <span data-i18n="whk.register">+ Register</span>
      </button>
    </div>

    <template x-if="hooks.length === 0 && !loading">
      <div class="px-4 py-8 text-center text-gray-500 text-sm" data-i18n="whk.empty">No webhooks registered for this workspace.</div>
    </template>

    <template x-if="hooks.length > 0">
      <table class="w-full text-sm">
        <thead class="border-b border-gray-800">
          <tr class="text-gray-400 text-xs uppercase tracking-wide">
            <th class="px-4 py-3 text-left" data-i18n="whk.col.url">URL</th>
            <th class="px-4 py-3 text-left" data-i18n="whk.col.events">Events</th>
            <th class="px-4 py-3 text-left" data-i18n="whk.col.label">Label</th>
            <th class="px-4 py-3 text-left" data-i18n="whk.col.status">Status</th>
            <th class="px-4 py-3 text-left" data-i18n="whk.col.created">Created</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="hook in hooks" :key="hook.id">
            <tr class="border-b border-gray-800 last:border-0 hover:bg-gray-800/40 transition">
              <td class="px-4 py-3 font-mono text-xs text-indigo-300 max-w-xs truncate" x-text="hook.url" :title="hook.url"></td>
              <td class="px-4 py-3">
                <template x-for="ev in hook.events" :key="ev">
                  <span class="inline-block mr-1 px-2 py-0.5 rounded text-xs bg-gray-700 text-gray-300 font-mono" x-text="ev"></span>
                </template>
              </td>
              <td class="px-4 py-3 text-gray-400 text-xs" x-text="hook.label || '—'"></td>
              <td class="px-4 py-3">
                <span :class="hook.enabled ? 'text-green-400' : 'text-gray-500'" class="text-xs font-medium"
                  x-text="hook.enabled ? 'active' : 'disabled'"></span>
              </td>
              <td class="px-4 py-3 text-gray-500 text-xs" x-text="fmtDate(hook.created_at)"></td>
              <td class="px-4 py-3 text-right flex items-center justify-end gap-2">
                <button @click="toggleHook(hook.id)"
                  class="text-xs px-2 py-1 rounded transition"
                  :class="hook.enabled
                    ? 'text-yellow-400 hover:text-yellow-300 hover:bg-yellow-950'
                    : 'text-green-400 hover:text-green-300 hover:bg-green-950'"
                  :title="hook.enabled ? 'Disable' : 'Enable'"
                  x-text="hook.enabled ? 'Disable' : 'Enable'"></button>
                <button @click="loadDeliveries(hook.id)"
                  class="text-xs text-gray-400 hover:text-white transition px-2 py-1 rounded hover:bg-gray-800"
                  :class="deliveriesHookId === hook.id ? 'text-indigo-400' : ''"
                  title="Delivery log">Log</button>
                <button @click="deleteHook(hook.id)"
                  class="text-xs text-red-400 hover:text-red-300 transition px-2 py-1 rounded hover:bg-red-950">
                  <span data-i18n="whk.delete">Delete</span>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
  </div>
</div>

<!-- Delivery log -->
<div class="px-6 mb-6" x-show="selectedWsId && (deliveriesHookId || deliveriesLoading)" x-cloak>
  <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
    <div class="px-4 py-3 border-b border-gray-800 flex items-center justify-between">
      <span class="text-sm font-medium text-gray-300">Delivery log</span>
      <button @click="deliveries = []; deliveriesHookId = null" class="text-xs text-gray-500 hover:text-gray-300">✕ Close</button>
    </div>
    <template x-if="deliveriesLoading">
      <div class="px-4 py-6 text-center text-gray-500 text-sm animate-pulse">Loading…</div>
    </template>
    <template x-if="!deliveriesLoading && deliveries.length === 0">
      <div class="px-4 py-6 text-center text-gray-500 text-sm">No deliveries recorded yet.</div>
    </template>
    <template x-if="!deliveriesLoading && deliveries.length > 0">
      <table class="w-full text-sm">
        <thead class="border-b border-gray-800">
          <tr class="text-gray-400 text-xs uppercase tracking-wide">
            <th class="px-4 py-2 text-left">Run</th>
            <th class="px-4 py-2 text-left">Status</th>
            <th class="px-4 py-2 text-right">Attempts</th>
            <th class="px-4 py-2 text-left">Error</th>
            <th class="px-4 py-2 text-right">Created</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="d in deliveries" :key="d.id">
            <tr class="border-t border-gray-800 hover:bg-gray-800/30 transition">
              <td class="px-4 py-2 font-mono text-xs text-gray-400" x-text="(d.run_id || '').slice(0,12) + '…'"></td>
              <td class="px-4 py-2">
                <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                  :class="{
                    'bg-green-900/50 text-green-300': d.status === 'delivered',
                    'bg-red-900/50 text-red-300': d.status === 'failed',
                    'bg-yellow-900/50 text-yellow-300': d.status === 'retrying',
                    'bg-gray-800 text-gray-400': d.status === 'pending'
                  }"
                  x-text="d.status"></span>
              </td>
              <td class="px-4 py-2 text-right text-gray-500 text-xs" x-text="d.attempts"></td>
              <td class="px-4 py-2 text-xs text-red-400 truncate max-w-xs" :title="d.last_error" x-text="d.last_error || '—'"></td>
              <td class="px-4 py-2 text-right text-gray-500 text-xs" x-text="fmtDate(d.created_at)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
  </div>
</div>

<!-- Create modal -->
<div x-show="showCreate" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50"
  @keydown.escape.window="showCreate = false">
  <div class="bg-gray-900 border border-gray-700 rounded-xl w-full max-w-md p-6 shadow-xl"
    @click.outside="showCreate = false">
    <h2 class="text-base font-semibold mb-4" data-i18n="whk.modal.title">Register Webhook</h2>

    <div class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1"><span data-i18n="whk.modal.url">URL</span> <span class="text-red-400">*</span></label>
        <input x-model="form.url" type="url" placeholder="https://example.com/webhook"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-600">
        <p class="text-xs text-gray-500 mt-1" data-i18n="whk.modal.https">Must start with https://</p>
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1" data-i18n="whk.modal.events">Event types</label>
        <div class="space-y-1">
          <template x-for="ev in availableEvents" :key="ev">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" :value="ev" x-model="form.events"
                class="rounded border-gray-600 bg-gray-800 text-indigo-500 focus:ring-indigo-500">
              <span class="text-sm font-mono text-gray-300" x-text="ev"></span>
            </label>
          </template>
        </div>
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1"><span data-i18n="whk.modal.label">Label</span> <span class="text-gray-600" data-i18n="whk.modal.optional">(optional)</span></label>
        <input x-model="form.label" type="text" placeholder="e.g. CI notifier"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-600">
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button @click="showCreate = false"
        class="px-4 py-2 text-sm text-gray-400 hover:text-white transition" data-i18n="whk.modal.cancel">Cancel</button>
      <button @click="createHook()"
        :disabled="!form.url || form.events.length === 0 || saving"
        class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed
               text-white text-sm font-medium px-4 py-2 rounded-lg transition">
        <span x-show="!saving" data-i18n="whk.modal.register">Register</span>
        <span x-show="saving" x-cloak data-i18n="whk.modal.registering">Registering…</span>
      </button>
    </div>
    <p x-show="formError" class="text-xs text-red-400 mt-2" x-text="formError"></p>
  </div>
</div>

<script>
function webhooks() {
  return {
    workspaces: [],
    selectedWsId: '',
    hooks: [],
    loading: false,
    error: null,
    showCreate: false,
    saving: false,
    formError: null,
    availableEvents: ['pipeline.end', 'hitl.review_required', '*'],
    form: { url: '', events: ['pipeline.end'], label: '' },
    deliveries: [],
    deliveriesLoading: false,
    deliveriesHookId: null,

    apiHeaders(extra = {}) {
      const k = localStorage.getItem('antcrew_api_key');
      const h = { 'Content-Type': 'application/json', ...extra };
      if (k) h['X-Api-Key'] = k;
      return h;
    },

    async init() {
      try {
        const r = await fetch('/workspaces/', { headers: this.apiHeaders() });
        if (!r.ok) throw new Error(`${r.status}`);
        this.workspaces = await r.json();
        if (this.workspaces.length === 1) {
          this.selectedWsId = String(this.workspaces[0].id);
          await this.loadHooks();
        }
      } catch (e) {
        this.error = 'Failed to load workspaces: ' + e.message;
      }
    },

    async loadHooks() {
      if (!this.selectedWsId) return;
      this.loading = true;
      this.hooks = [];
      this.deliveries = [];
      this.deliveriesHookId = null;
      try {
        const r = await fetch(`/workspaces/${this.selectedWsId}/webhooks`, { headers: this.apiHeaders() });
        if (!r.ok) throw new Error(`${r.status}`);
        this.hooks = await r.json();
      } catch (e) {
        this.error = 'Failed to load webhooks: ' + e.message;
      } finally {
        this.loading = false;
      }
    },

    async createHook() {
      this.formError = null;
      if (!this.form.url.startsWith('https://')) {
        this.formError = 'URL must start with https://';
        return;
      }
      if (this.form.events.length === 0) {
        this.formError = 'Select at least one event type.';
        return;
      }
      this.saving = true;
      try {
        const r = await fetch(`/workspaces/${this.selectedWsId}/webhooks`, {
          method: 'POST',
          headers: this.apiHeaders(),
          body: JSON.stringify({
            url: this.form.url,
            events: this.form.events,
            label: this.form.label || null,
          }),
        });
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          this.formError = body?.detail || `HTTP ${r.status}`;
          return;
        }
        this.showCreate = false;
        this.form = { url: '', events: ['pipeline.end'], label: '' };
        await this.loadHooks();
      } catch (e) {
        this.formError = e.message;
      } finally {
        this.saving = false;
      }
    },

    async toggleHook(id) {
      try {
        const r = await fetch(`/workspaces/${this.selectedWsId}/webhooks/${id}/toggle`, {
          method: 'PATCH',
          headers: this.apiHeaders(),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const updated = await r.json();
        const idx = this.hooks.findIndex(h => h.id === id);
        if (idx !== -1) this.hooks[idx] = updated;
      } catch (e) {
        this.error = 'Toggle failed: ' + e.message;
      }
    },

    async deleteHook(id) {
      if (!confirm('Delete this webhook?')) return;
      try {
        const r = await fetch(`/workspaces/${this.selectedWsId}/webhooks/${id}`, {
          method: 'DELETE',
          headers: this.apiHeaders(),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        this.hooks = this.hooks.filter(h => h.id !== id);
        if (this.deliveriesHookId === id) { this.deliveries = []; this.deliveriesHookId = null; }
      } catch (e) {
        this.error = 'Failed to delete webhook: ' + e.message;
      }
    },

    async loadDeliveries(hookId) {
      if (this.deliveriesHookId === hookId) {
        this.deliveries = [];
        this.deliveriesHookId = null;
        return;
      }
      this.deliveriesLoading = true;
      this.deliveriesHookId = hookId;
      try {
        const url = `/workspaces/${this.selectedWsId}/webhook-deliveries?webhook_id=${hookId}&limit=20`;
        const r = await fetch(url, { headers: this.apiHeaders() });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        this.deliveries = await r.json();
      } catch (e) {
        this.error = 'Failed to load deliveries: ' + e.message;
        this.deliveriesHookId = null;
      } finally {
        this.deliveriesLoading = false;
      }
    },

    fmtDate(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleString(); } catch { return iso; }
    },
  };
}
</script>
