# PROD — standalone compose for the permanent Hetzner server.
# Not an override of docker-compose.yml; deployed alone on the remote host.
#
# PLATFORM_IMAGE must be set before running:
#   export PLATFORM_IMAGE=ghcr.io/<owner>/<repo>:prod-latest
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets come from .env.prod (written by the deploy workflow — never commit it).
# Alembic migrations run automatically before uvicorn starts.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 128 MB cap with LRU eviction — plenty for rate-limit keys at current scale.
    # Adjust maxmemory upward before launching session-cache or queue features.
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data

  platform:
    image: ${PLATFORM_IMAGE}
    env_file: .env.prod
    environment:
      APP_ENV: prod
      HOST: 0.0.0.0
      ANTCREW_SANDBOX: required
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      ANTCREW_REQUIRE_AUTH: "true"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "80:8000"
    restart: unless-stopped
    depends_on:
      - redis
    command: >
      sh -c "python -m alembic upgrade head && uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1"

volumes:
  redis_data:
