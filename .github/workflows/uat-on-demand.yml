name: UAT — on-demand start

# Powers on the UAT Hetzner server (which auto-shut-down after 60 min) and
# resets the 60-minute auto-shutdown timer. Does NOT rebuild the image.
# Run this when you need UAT again after it has powered off.
#
# Prerequisites: the server must already exist (run Deploy → UAT first).
# If the server was deleted by a subsequent Deploy → UAT, it no longer exists
# and this workflow will fail with a clear error message.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: Auto-shutdown after N hours
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '4', '8']

jobs:
  start:
    name: Start UAT server
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Install hcloud CLI
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz \
            | tar xzf - hcloud
          sudo mv hcloud /usr/local/bin/hcloud

      - name: Set up SSH key
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_uat
          chmod 600 ~/.ssh/hetzner_uat
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' >> ~/.ssh/config

      - name: Power on UAT server
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if ! hcloud server describe antcrew-uat &>/dev/null; then
            echo "::error::Server antcrew-uat does not exist."
            echo "::error::Run the Deploy workflow and choose UAT to create it."
            exit 1
          fi

          STATUS=$(hcloud server describe antcrew-uat -o json | jq -r '.status')
          echo "Current status: $STATUS"

          if [ "$STATUS" = "running" ]; then
            echo "Server is already running — will just reset the auto-shutdown timer."
          else
            echo "Powering on antcrew-uat…"
            hcloud server poweron antcrew-uat --wait
            echo "Server powered on."
          fi

          UAT_IP=$(hcloud server describe antcrew-uat -o json | jq -r '.public_net.ipv4.ip')
          echo "UAT_IP=$UAT_IP" >> "$GITHUB_ENV"

      - name: Wait for SSH
        run: |
          echo "Waiting for SSH on $UAT_IP…"
          for i in $(seq 1 24); do
            if ssh -i ~/.ssh/hetzner_uat -o ConnectTimeout=5 root@"$UAT_IP" true 2>/dev/null; then
              echo "SSH ready (attempt $i)."
              break
            fi
            [ "$i" -eq 24 ] && { echo "::error::SSH timeout after 120 s"; exit 1; }
            sleep 5
          done

      - name: Ensure services are running and reset deletion timer
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          SHUTDOWN_SECS=$(( ${{ github.event.inputs.hours || '1' }} * 3600 ))

          ssh -i ~/.ssh/hetzner_uat root@"$UAT_IP" bash << REMOTE
          set -euo pipefail
          cd /opt/antcrew

          if [ -f /opt/antcrew/.platform-image-env ]; then
            source /opt/antcrew/.platform-image-env
            export PLATFORM_IMAGE
          else
            echo "WARNING: .platform-image-env not found — containers may already be running"
          fi

          docker compose -f docker-compose.uat.yml up -d --remove-orphans 2>/dev/null || true

          # Reset self-deletion timer (kill old one, start fresh)
          [ -f /opt/antcrew/cleanup.pid ] && kill \$(cat /opt/antcrew/cleanup.pid) 2>/dev/null || true

          (sleep $SHUTDOWN_SECS
           TOKEN=\$(cat /opt/antcrew/.hcloud_token)
           SERVER_ID=\$(curl -sf -H "Authorization: Bearer \$TOKEN" \
             "https://api.hetzner.cloud/v1/servers?name=antcrew-uat" \
             | jq -r '.servers[0].id // empty')
           [ -n "\$SERVER_ID" ] && curl -sf -X DELETE \
             -H "Authorization: Bearer \$TOKEN" \
             "https://api.hetzner.cloud/v1/servers/\$SERVER_ID"
          ) </dev/null >/var/log/uat-cleanup.log 2>&1 &
          echo \$! > /opt/antcrew/cleanup.pid
          disown

          echo "Services running. Server self-deletes in $(( $SHUTDOWN_SECS / 60 )) minutes."
          REMOTE

          HOURS=${{ github.event.inputs.hours || '1' }}
          echo "UAT live at http://$UAT_IP:8000 (auto-deletes in ${HOURS}h)"
